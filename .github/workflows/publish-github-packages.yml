# Publishes this fork's modules to GitHub Packages.
#
# Triggers:
#   - pushing a tag matching v*  (e.g. v1.10.1-no-anti-ai)
#   - manual run via the Actions tab (workflow_dispatch)
#
# The published version is whatever `jqwikVersion` is set to in
# dependencies.gradle at the checked-out ref. Coordinates stay net.jqwik:*
# so the artifacts are drop-in replacements for upstream jqwik.
#
# No secrets to configure: the built-in GITHUB_TOKEN (with packages: write)
# is picked up by the build via the GITHUB_ACTOR / GITHUB_TOKEN env vars.
name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Publish
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
